name: Buildsus

on:
  push:
   branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Base Libraries
        run: |
          haxelib install hxcpp --quiet
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hxCodec --quiet
          haxelib install hxp --quiet
          haxelib install hscript --quiet

      - name: Install Git Libraries
        run: |
          git clone https://github.com/Aidan63/linc_discord-rpc discord_rpc
          haxelib dev discord_rpc discord_rpc

          git clone https://github.com/Dot-Stuff/flxanimate flxanimate
          haxelib dev flxanimate flxanimate

          git clone https://github.com/MAJigsaw77/linc_luajit linc_luajit
          haxelib dev linc_luajit linc_luajit

          git clone https://github.com/MatheusSilver/extension-webview extension-webview
          haxelib dev extension-webview extension-webview

          git clone https://github.com/MAJigsaw77/extension-videoview extension-videoview
          haxelib dev extension-videoview extension-videoview

          git clone https://github.com/MAJigsaw77/extension-androidtools extension-androidtools
          haxelib dev extension-androidtools extension-androidtools

          haxelib list

      - name: Configure Lime
        run: |
          haxelib run lime setup -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Create Version
        run: echo "${{ github.run_id }}" > VERSION

      - name: Compile Game
        run: |
          haxelib run lime build android -release --app-version="4.0.0-${{ github.run_id }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android Build
          path: export/release/android/bin/app/build/outputs/apk